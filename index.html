<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PaperDesk — PDF 合併・分割・重排</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:#1a1a2e;color:#e0e0e0;height:100vh;display:flex;flex-direction:column;overflow:hidden}

header{background:#16213e;padding:10px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #0f3460;flex-shrink:0;flex-wrap:wrap}
header h1{font-size:16px;color:#e94560;white-space:nowrap}
header .tagline{font-size:12px;color:#4a6fa5}
.spacer{flex:1}
.file-label{background:#0f3460;border:1px solid #e94560;color:#e94560;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;white-space:nowrap}
.file-label:hover{background:#e94560;color:#fff}
#file-input{display:none}

.toolbar{background:#131c33;padding:8px 20px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #0f3460;flex-shrink:0;flex-wrap:wrap}
.btn{background:#0f3460;border:none;color:#e0e0e0;padding:6px 12px;border-radius:5px;cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover:not(:disabled){background:#1d4d8c}
.btn:disabled{opacity:.35;cursor:default}
.btn.primary{background:#e94560;color:#fff;font-weight:600}
.btn.primary:hover:not(:disabled){background:#ff5c77}
.btn.danger{color:#ff8fa3}
.sep{width:1px;height:20px;background:#0f3460;margin:0 4px}
.count{font-size:12px;color:#4a6fa5;margin-left:4px}

main{flex:1;overflow:auto;padding:20px;background:#0f1b35;position:relative}

.drop-hint{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#4a6fa5;font-size:17px;height:100%;border:2px dashed #4a6fa5;border-radius:12px;text-align:center;padding:20px}
.drop-hint.drag-over{border-color:#e94560;color:#e94560;background:rgba(233,69,96,.05)}
.drop-hint svg{width:48px;height:48px;opacity:.5}
.drop-hint small{font-size:13px;opacity:.75;line-height:1.7}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.pg{position:relative;background:#16213e;border:2px solid transparent;border-radius:8px;padding:8px;cursor:pointer;transition:border-color .12s,transform .12s;user-select:none}
.pg:hover{border-color:#4a6fa5}
.pg.sel{border-color:#e94560;background:#22182e}
.pg.dragging{opacity:.4}
.pg.drop-before{box-shadow:-3px 0 0 #2a9d8f}
.pg.drop-after{box-shadow:3px 0 0 #2a9d8f}
.pg canvas{display:block;width:100%;height:auto;background:#fff;border-radius:3px}
.pg .ph{width:100%;aspect-ratio:1/1.414;background:#0f1b35;border-radius:3px;display:flex;align-items:center;justify-content:center;color:#4a6fa5;font-size:12px}
.pg .meta{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:11px;color:#8fa3c8;gap:4px}
.pg .num{font-weight:600;color:#e0e0e0}
.pg .src{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.7;direction:rtl}
.pg .badge{position:absolute;top:12px;right:12px;background:#2a9d8f;color:#fff;font-size:10px;padding:1px 5px;border-radius:3px}

footer{background:#16213e;padding:6px 20px;font-size:11px;color:#4a6fa5;border-top:1px solid #0f3460;flex-shrink:0;display:flex;gap:16px;flex-wrap:wrap}
footer a{color:#4a6fa5}

.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:#16213e;border:1px solid #e94560;color:#e0e0e0;padding:10px 20px;border-radius:8px;font-size:13px;z-index:99;box-shadow:0 4px 20px rgba(0,0,0,.5)}
</style>
</head>
<body>

<header>
  <h1>📄 PaperDesk</h1>
  <span class="tagline">合併・分割・重排・轉正 — 檔案不離開你的瀏覽器</span>
  <span class="spacer"></span>
  <label class="file-label" for="file-input">＋ 加入 PDF</label>
  <input type="file" id="file-input" accept="application/pdf,.pdf" multiple>
</header>

<div class="toolbar" id="toolbar" style="display:none">
  <button class="btn" id="sel-all">全選</button>
  <button class="btn" id="sel-none">取消選取</button>
  <button class="btn" id="sel-invert">反選</button>
  <span class="sep"></span>
  <button class="btn" id="rot-l" disabled>↺ 左轉</button>
  <button class="btn" id="rot-r" disabled>↻ 右轉</button>
  <button class="btn danger" id="del" disabled>🗑 刪除</button>
  <span class="sep"></span>
  <button class="btn primary" id="save-all" disabled>⬇ 匯出全部</button>
  <button class="btn primary" id="save-sel" disabled>⬇ 匯出選取</button>
  <span class="count" id="count"></span>
</div>

<main id="main">
  <div class="drop-hint" id="drop-hint">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
    </svg>
    拖入 PDF，或點右上角「加入 PDF」
    <small>
      可一次拖多個檔案 → 自動合併成一份<br>
      點縮圖選取、拖曳調整順序、刪除不要的頁<br>
      全部在本機處理，不會上傳到任何伺服器
    </small>
  </div>
  <div class="grid" id="grid" style="display:none"></div>
</main>

<footer>
  <span>🔒 純前端處理，PDF 不會離開這台電腦</span>
  <span>PDF.js · pdf-lib</span>
  <a href="https://github.com/kerr20801/PaperDesk" target="_blank" rel="noopener">GitHub</a>
</footer>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const {PDFDocument, degrees} = PDFLib;

// ── 狀態 ────────────────────────────────────────────────
// sources: 載入過的原始檔（合併時會有多份）
// pages  : 目前這份「虛擬文件」的組成，就是一個有序陣列。
//          合併=push、刪頁=filter、重排=換位置、分割=只匯出選取的。
//          每頁帶穩定 uid，之後要接簽名功能時綁 uid 不綁頁碼，重排才不會跑掉。
const sources = new Map();          // srcId -> {name, bytes, jsDoc}
let pages = [];                     // {uid, srcId, idx, rot, sel}
let uidSeq = 0, srcSeq = 0;

const $ = id => document.getElementById(id);
const grid = $('grid'), dropHint = $('drop-hint'), toolbar = $('toolbar');

function toast(msg, ms = 2600){
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), ms);
}

// ── 載入 ────────────────────────────────────────────────
async function addFiles(fileList){
  const files = [...fileList].filter(f =>
    f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf'));
  if(!files.length){ toast('請選擇 PDF 檔'); return; }

  for(const f of files){
    try{
      const bytes = new Uint8Array(await f.arrayBuffer());
      // pdf.js 會接管 buffer，複製一份留給 pdf-lib 匯出用
      const jsDoc = await pdfjsLib.getDocument({data: bytes.slice(0)}).promise;
      const srcId = 's' + (++srcSeq);
      sources.set(srcId, {name: f.name, bytes, jsDoc});
      for(let i = 0; i < jsDoc.numPages; i++){
        pages.push({uid: 'p' + (++uidSeq), srcId, idx: i, rot: 0, sel: false});
      }
    }catch(err){
      console.error(err);
      toast(`「${f.name}」讀取失敗：${err.message}`, 4000);
    }
  }
  render();
}

// ── 畫面 ────────────────────────────────────────────────
function render(){
  const has = pages.length > 0;
  dropHint.style.display = has ? 'none' : 'flex';
  grid.style.display = has ? 'grid' : 'none';
  toolbar.style.display = has ? 'flex' : 'none';

  grid.innerHTML = '';
  pages.forEach((p, i) => grid.appendChild(makeCard(p, i)));
  updateToolbar();
}

function makeCard(p, i){
  const src = sources.get(p.srcId);
  const el = document.createElement('div');
  el.className = 'pg' + (p.sel ? ' sel' : '');
  el.dataset.uid = p.uid;
  el.draggable = true;

  const ph = document.createElement('div');
  ph.className = 'ph'; ph.textContent = '載入中…';
  el.appendChild(ph);

  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.innerHTML = `<span class="num">${i + 1}</span>` +
                   `<span class="src" title="${esc(src.name)} 第 ${p.idx + 1} 頁">${esc(src.name)}</span>`;
  el.appendChild(meta);

  if(p.rot % 360 !== 0){
    const b = document.createElement('span');
    b.className = 'badge'; b.textContent = ((p.rot % 360) + 360) % 360 + '°';
    el.appendChild(b);
  }

  el.addEventListener('click', () => { p.sel = !p.sel; el.classList.toggle('sel', p.sel); updateToolbar(); });
  wireDrag(el, p);
  drawThumb(p, ph);
  return el;
}

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function drawThumb(p, ph){
  try{
    const {jsDoc} = sources.get(p.srcId);
    const page = await jsDoc.getPage(p.idx + 1);
    // 縮圖套用「頁面原有旋轉 + 使用者加的旋轉」，看到的就是匯出後的樣子
    const base = page.rotate || 0;
    const vp0 = page.getViewport({scale: 1, rotation: base + p.rot});
    const scale = 150 / vp0.width;
    const vp = page.getViewport({scale, rotation: base + p.rot});
    const cv = document.createElement('canvas');
    cv.width = Math.ceil(vp.width); cv.height = Math.ceil(vp.height);
    await page.render({canvasContext: cv.getContext('2d'), viewport: vp}).promise;
    ph.replaceWith(cv);
  }catch(err){
    console.error(err);
    ph.textContent = '無法預覽';
  }
}

function updateToolbar(){
  const n = pages.filter(p => p.sel).length;
  $('count').textContent = `共 ${pages.length} 頁${n ? `，已選 ${n} 頁` : ''}`;
  ['rot-l','rot-r','del','save-sel'].forEach(id => $(id).disabled = n === 0);
  $('save-all').disabled = pages.length === 0;
}

// ── 拖曳排序 ────────────────────────────────────────────
let dragUid = null;
function wireDrag(el, p){
  el.addEventListener('dragstart', e => {
    dragUid = p.uid; el.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', p.uid);   // Firefox 需要
  });
  el.addEventListener('dragend', () => {
    dragUid = null; el.classList.remove('dragging');
    document.querySelectorAll('.pg').forEach(x => x.classList.remove('drop-before','drop-after'));
  });
  el.addEventListener('dragover', e => {
    if(!dragUid || dragUid === p.uid) return;
    e.preventDefault();
    const r = el.getBoundingClientRect();
    const after = e.clientX > r.left + r.width / 2;
    el.classList.toggle('drop-after', after);
    el.classList.toggle('drop-before', !after);
  });
  el.addEventListener('dragleave', () => el.classList.remove('drop-before','drop-after'));
  el.addEventListener('drop', e => {
    e.preventDefault();
    if(!dragUid || dragUid === p.uid) return;
    const r = el.getBoundingClientRect();
    const after = e.clientX > r.left + r.width / 2;
    const from = pages.findIndex(x => x.uid === dragUid);
    const moved = pages.splice(from, 1)[0];
    let to = pages.findIndex(x => x.uid === p.uid);
    pages.splice(after ? to + 1 : to, 0, moved);
    render();
  });
}

// ── 操作 ────────────────────────────────────────────────
$('sel-all').onclick    = () => { pages.forEach(p => p.sel = true);  render(); };
$('sel-none').onclick   = () => { pages.forEach(p => p.sel = false); render(); };
$('sel-invert').onclick = () => { pages.forEach(p => p.sel = !p.sel); render(); };

$('rot-l').onclick = () => rotate(-90);
$('rot-r').onclick = () => rotate(90);
function rotate(deg){
  pages.forEach(p => { if(p.sel) p.rot = (((p.rot + deg) % 360) + 360) % 360; });
  render();
}

$('del').onclick = () => {
  const n = pages.filter(p => p.sel).length;
  if(!n) return;
  if(n === pages.length && !confirm('這會刪掉全部頁面，確定？')) return;
  pages = pages.filter(p => !p.sel);
  render();
  toast(`已刪除 ${n} 頁`);
};

// ── 匯出 ────────────────────────────────────────────────
$('save-all').onclick = () => exportPdf(pages, 'PaperDesk');
$('save-sel').onclick = () => exportPdf(pages.filter(p => p.sel), 'PaperDesk_selected');

async function exportPdf(list, prefix){
  if(!list.length){ toast('沒有頁面可匯出'); return; }
  const btns = [...document.querySelectorAll('.btn')];
  btns.forEach(b => b.disabled = true);
  try{
    const out = await PDFDocument.create();
    // 同一份來源檔只解析一次，多頁匯出時不用重複 load
    const libCache = new Map();
    for(const p of list){
      let lib = libCache.get(p.srcId);
      if(!lib){
        lib = await PDFDocument.load(sources.get(p.srcId).bytes.slice(0));
        libCache.set(p.srcId, lib);
      }
      const [copied] = await out.copyPages(lib, [p.idx]);
      if(p.rot % 360 !== 0){
        // 疊加在頁面原本的 /Rotate 上，不是覆蓋
        copied.setRotation(degrees((copied.getRotation().angle + p.rot) % 360));
      }
      out.addPage(copied);
    }
    const blob = new Blob([await out.save()], {type: 'application/pdf'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${prefix}_${Date.now()}.pdf`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast(`已匯出 ${list.length} 頁`);
  }catch(err){
    console.error(err);
    toast('匯出失敗：' + err.message, 4000);
  }finally{
    btns.forEach(b => b.disabled = false);
    updateToolbar();
  }
}

// ── 輸入 ────────────────────────────────────────────────
$('file-input').addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });

['dragenter','dragover'].forEach(ev => document.addEventListener(ev, e => {
  if(![...(e.dataTransfer?.types || [])].includes('Files')) return;
  e.preventDefault(); dropHint.classList.add('drag-over');
}));
document.addEventListener('dragleave', e => {
  if(e.relatedTarget === null) dropHint.classList.remove('drag-over');
});
document.addEventListener('drop', e => {
  if(!e.dataTransfer?.files?.length) return;
  e.preventDefault();
  dropHint.classList.remove('drag-over');
  addFiles(e.dataTransfer.files);
});
</script>
</body>
</html>
